<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema Hospital ANDAGON</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<div class="login-container">
  <div class="logo">
    <i class="fas fa-hospital-user"></i>
    <h1>Hospital ANDAGON</h1>
    <p>Sistema de Gestión Hospitalaria</p>
  </div>

  <div class="error-message" id="errorMessage">
    <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
  </div>

  <form id="loginForm" onsubmit="login(event)">
    <div class="form-group">
      <label><i class="fas fa-user"></i> Usuario</label>
      <input type="text" id="usuario" placeholder="Ingrese su usuario" required autocomplete="off">
    </div>
    <div class="form-group">
      <label><i class="fas fa-lock"></i> Contraseña</label>
      <input type="password" id="contrasena" placeholder="Ingrese su contraseña" required>
    </div>
    <button type="submit" class="btn-login">
      <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
    </button>
  </form>

  <div class="demo-credentials">
    <strong>🔐 Credenciales de prueba:</strong><br>
    Invitado: invitado / invitado123
  </div>
</div>

<script>
  async function login(event) {
    event.preventDefault();
    
    const usuario = document.getElementById('usuario').value.trim();
    const contrasena = document.getElementById('contrasena').value.trim();
    const errorDiv = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    
    if (!usuario || !contrasena) {
      errorText.textContent = 'Complete todos los campos';
      errorDiv.style.display = 'block';
      return;
    }
    
    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, contrasena })
      });
      
      const result = await response.json();
      
      if (result.success) {
        localStorage.setItem('usuario', JSON.stringify(result.usuario));
        localStorage.setItem('token', result.token);
        window.location.href = '/panel';
      } else {
        errorText.textContent = result.error || 'Usuario o contraseña incorrectos';
        errorDiv.style.display = 'block';
      }
    } catch (err) {
      errorText.textContent = 'Error de conexión';
      errorDiv.style.display = 'block';
    }
  }
</script>
</body>
</html>
