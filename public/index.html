<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Hospital ANDAGON</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/estilo.css" id="theme-style">
</head>
<body>

<div class="header">
  <div class="header-inner">
    <i class="fas fa-hospital-user"></i>
    <div>
      <h1>Sistema de Gestión Hospitalaria ANDAGON</h1>
      <p id="header-info">Panel de administración · Cargando...</p>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">
      <i class="fas fa-moon"></i> Modo Oscuro
    </button>
  </div>
</div>

<div class="main">
  
  <div class="stats">
    <div class="stat"><div class="stat-label"><i class="fas fa-user-injured"></i> Pacientes</div><div class="stat-val" id="s-pacientes">—</div></div>
    <div class="stat"><div class="stat-label"><i class="fas fa-user-md"></i> Doctores</div><div class="stat-val" id="s-doctores">—</div></div>
    <div class="stat"><div class="stat-label"><i class="fas fa-user-nurse"></i> Enfermeras</div><div class="stat-val" id="s-Enfermeras">—</div></div>
    <div class="stat"><div class="stat-label"><i class="fas fa-pills"></i> Medicamentos</div><div class="stat-val" id="s-Medicamentos">—</div></div>
    <div class="stat"><div class="stat-label"><i class="fas fa-calendar-check"></i> Citas</div><div class="stat-val" id="s-Citas">—</div></div>
    <div class="stat"><div class="stat-label"><i class="fas fa-bed"></i> Habitaciones</div><div class="stat-val" id="s-habitaciones">—</div></div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="cargar('pacientes', this)"><i class="fas fa-user-injured"></i> Pacientes</button>
    <button class="nav-btn" onclick="cargar('doctores', this)"><i class="fas fa-user-md"></i> Doctores</button>
    <button class="nav-btn" onclick="cargar('Enfermeras', this)"><i class="fas fa-user-nurse"></i> Enfermeras</button>
    <button class="nav-btn" onclick="cargar('Medicamentos', this)"><i class="fas fa-pills"></i> Medicamentos</button>
    <button class="nav-btn" onclick="cargar('Citas', this)"><i class="fas fa-calendar-check"></i> Citas</button>
    <button class="nav-btn" onclick="cargar('habitaciones', this)"><i class="fas fa-bed"></i> Habitaciones</button>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title" id="card-title">Pacientes</div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <span class="badge" id="count-badge">0 registros</span>
        <button class="btn-export" onclick="exportarDatos()" title="Exportar a Excel">
          <i class="fas fa-download"></i> Exportar
        </button>
      </div>
    </div>
    <div id="contenido"><div class="loading"><i class="fas fa-spinner fa-pulse"></i> Cargando datos...</div></div>
  </div>
</div>

<!-- Botón flotante (SOLO visible para Admin) -->
<button class="fab-btn" id="fabBtn" onclick="abrirModal()" style="display: none;">
  <i class="fas fa-plus"></i>
</button>

<div class="modal" id="modalFormulario">
  <div class="modal-content">
    <div class="modal-header"><h3 id="modal-titulo"><i class="fas fa-plus-circle"></i> Nuevo Registro</h3></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardar" onclick="guardarRegistro()"><i class="fas fa-save"></i> Guardar</button>
    </div>
  </div>
</div>

<script>
  // ==================== VERIFICAR SESIÓN ====================
const usuario = JSON.parse(localStorage.getItem('usuario') || 'null');
const token = localStorage.getItem('token');

// Verificar si el token ha expirado
function tokenExpirado(token) {
  if (!token) return true;
  try {
    const decoded = JSON.parse(atob(token));
    return decoded.exp < Date.now();
  } catch (e) {
    return true;
  }
}

if (!usuario || !token || tokenExpirado(token)) {
  // Limpiar storage por si acaso
  localStorage.removeItem('usuario');
  localStorage.removeItem('token');
  // Redirigir al login
  window.location.href = '/login';
}
  // Verificar si es administrador
  const esAdmin = usuario && usuario.rol === 'Administrador';
  const esInvitado = usuario && usuario.rol === 'Invitado';

  // Actualizar header con info del usuario
  document.addEventListener('DOMContentLoaded', function() {
    const headerInfo = document.getElementById('header-info');
    if (headerInfo && usuario) {
      headerInfo.innerHTML = `Panel de administración · ${usuario.nombre_completo} (${usuario.rol}) · <a href="#" onclick="logout()" style="color:white; text-decoration:underline;">Cerrar sesión</a>`;
    }
    
    // Mostrar botón flotante solo para admin
    if (esAdmin) {
      document.getElementById('fabBtn').style.display = 'flex';
    }
  });

  function logout() {
    localStorage.removeItem('usuario');
    localStorage.removeItem('token');
    window.location.href = '/login';
  }

  // Modificar fetch para incluir token en todas las peticiones
  const originalFetch = window.fetch;
  window.fetch = function(url, options = {}) {
    if (token) {
      options.headers = options.headers || {};
      options.headers['Authorization'] = `Bearer ${token}`;
    }
    return originalFetch(url, options);
  };

  // ==================== VARIABLES GLOBALES ====================
  let seccionActual = 'pacientes';
  let ciudadesDisponibles = [];
  let especialidadesDisponibles = [];
  let especializacionesDisponibles = [];
  let departamentosDisponibles = [];
  let pacientesDisponibles = [];
  let doctoresDisponibles = [];
  let tiposHabitacionDisponibles = [];
  let registroEditando = null;
  let temaOscuro = false;

  // ==================== MODO OSCURO ====================
  function toggleTheme() {
    temaOscuro = !temaOscuro;
    const themeLink = document.getElementById('theme-style');
    const toggleBtn = document.getElementById('themeToggle');
    
    if (temaOscuro) {
      themeLink.href = '/css/estilo-oscuro.css';
      toggleBtn.innerHTML = '<i class="fas fa-sun"></i> Modo Claro';
      localStorage.setItem('theme', 'dark');
    } else {
      themeLink.href = '/css/estilo.css';
      toggleBtn.innerHTML = '<i class="fas fa-moon"></i> Modo Oscuro';
      localStorage.setItem('theme', 'light');
    }
  }

  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    temaOscuro = true;
    document.getElementById('theme-style').href = '/css/estilo-oscuro.css';
    document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i> Modo Claro';
  }

  // ==================== CARGAR ESTADÍSTICAS ====================
  async function cargarStat(sec) {
    try {
      const rutaAPI = sec === 'Enfermeras' ? 'Enfermeros' : sec;
      const r = await fetch('/api/' + rutaAPI);
      const d = await r.json();
      const el = document.getElementById('s-' + sec);
      if (el && Array.isArray(d)) el.textContent = d.length;
    } catch(e) { console.warn('Error:', sec); }
  }

  
  // ==================== EXPORTAR DATOS ====================
  async function exportarDatos() {
  try {
    let modulo = seccionActual;
    // Convertir a formato que espera el backend
    if (modulo === 'Enfermeras') modulo = 'enfermeras';
    else if (modulo === 'Medicamentos') modulo = 'medicamentos';
    else if (modulo === 'Citas') modulo = 'citas';
    else modulo = modulo.toLowerCase();
    
    window.open(`/api/exportar/${modulo}`, '_blank');
  } catch(e) {
    alert('Error al exportar: ' + e.message);
  }
}

  // ==================== CARGAR DATOS PARA DROPDOWNS ====================
  async function cargarCiudades() {
    try { const res = await fetch('/api/ciudades'); ciudadesDisponibles = await res.json(); } catch(e) {}
  }
  async function cargarEspecialidades() {
    try { const res = await fetch('/api/especialidades-lista'); especialidadesDisponibles = await res.json(); } catch(e) {}
  }
  async function cargarEspecializaciones() {
    try { const res = await fetch('/api/especializaciones-lista'); especializacionesDisponibles = await res.json(); } catch(e) {}
  }
  async function cargarDepartamentos() {
    try { const res = await fetch('/api/departamentos'); departamentosDisponibles = await res.json(); } catch(e) {}
  }
  async function cargarPacientes() {
    try { 
      const res = await fetch('/api/pacientes'); 
      const data = await res.json();
      pacientesDisponibles = data.map(p => ({ id: p.ID, nombre: p.Nombre + ' ' + p.Apellido }));
    } catch(e) {}
  }
  async function cargarDoctores() {
    try { 
      const res = await fetch('/api/doctores'); 
      const data = await res.json();
      doctoresDisponibles = data.map(d => ({ id: d.ID, nombre: d.Nombre + ' ' + d.Apellido + ' (' + d.Especialidad + ')' }));
    } catch(e) {}
  }
  async function cargarTiposHabitacion() {
    try { const res = await fetch('/api/tipos-habitacion'); tiposHabitacionDisponibles = await res.json(); } catch(e) {}
  }

  // ==================== ELIMINAR REGISTRO (SOLO ADMIN) ====================
  async function eliminarRegistro(seccion, id) {
    if (!esAdmin) {
      alert('No tiene permisos para eliminar registros.');
      return;
    }
    
    if (!confirm('¿Estás seguro de eliminar este registro? Esta acción no se puede deshacer.')) return;
    
    try {
      const rutaAPI = seccion === 'Enfermeras' ? 'Enfermeras' : seccion;
      const response = await fetch(`/api/${rutaAPI}/${id}`, { method: 'DELETE' });
      const result = await response.json();
      
      if (result.success) {
        alert('✅ Registro eliminado correctamente');
        cargar(seccionActual, document.querySelector('.nav-btn.active'));
        cargarStat(seccionActual);
      } else {
        alert('❌ ' + (result.error || 'No se pudo eliminar'));
      }
    } catch (err) {
      alert('❌ Error de conexión: ' + err.message);
    }
  }

  // ==================== EDITAR REGISTRO (SOLO ADMIN) ====================
  async function editarRegistro(seccion, id) {
    if (!esAdmin) {
      alert('No tiene permisos para editar registros.');
      return;
    }
    
    registroEditando = { seccion, id };
    
    try {
      const rutaAPI = seccion === 'Enfermeras' ? 'Enfermeros' : seccion;
      const res = await fetch(`/api/${rutaAPI}`);
      const datos = await res.json();
      const registro = datos.find(d => (d.ID || d.id) === id);
      
      if (!registro) { alert('No se pudo cargar el registro'); return; }
      
      await abrirModal();
      
      setTimeout(() => {
        const form = document.getElementById('formDinamico');
        const campos = form.querySelectorAll('input, select');
        
        campos.forEach(campo => {
          let valor = registro[campo.id] || registro[campo.id.charAt(0).toUpperCase() + campo.id.slice(1)];
          if (valor !== undefined && valor !== null) {
            if (campo.tagName === 'SELECT') {
              const opciones = Array.from(campo.options);
              const opcion = opciones.find(o => o.value == valor || o.text === valor);
              if (opcion) campo.value = opcion.value;
            } else {
              campo.value = valor;
            }
          }
        });
        
        document.getElementById('modal-titulo').innerHTML = `<i class="fas fa-edit"></i> Editar ${seccion.slice(0, -1)}`;
        document.getElementById('btnGuardar').innerHTML = '<i class="fas fa-save"></i> Actualizar';
        document.getElementById('btnGuardar').onclick = actualizarRegistro;
      }, 100);
      
    } catch (err) {
      alert('Error al cargar datos: ' + err.message);
    }
  }

  async function actualizarRegistro() {
    const form = document.getElementById('formDinamico');
    const campos = form.querySelectorAll('input, select');
    
    const data = {};
    campos.forEach(c => {
      if (c.value.trim()) {
        if (c.id === 'especialidad' && c.value === '__OTRA__') {
          data[c.id] = document.getElementById('especialidad_manual').value;
        } else if (c.id === 'especializacion' && c.value === '__OTRA__') {
          data[c.id] = document.getElementById('especializacion_manual').value;
        } else {
          data[c.id] = c.value;
        }
      }
    });
    
    try {
      const { seccion, id } = registroEditando;
      const rutaAPI = seccion === 'Enfermeras' ? 'Enfermeras' : seccion;
      
      const res = await fetch(`/api/${rutaAPI}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      
      const result = await res.json();
      
      if (result.success) {
        alert('✅ Registro actualizado correctamente');
        cerrarModal();
        cargar(seccionActual, document.querySelector('.nav-btn.active'));
        cargarStat(seccionActual);
        document.getElementById('btnGuardar').innerHTML = '<i class="fas fa-save"></i> Guardar';
        document.getElementById('btnGuardar').onclick = guardarRegistro;
        registroEditando = null;
      } else {
        alert('❌ Error: ' + result.error);
      }
    } catch (err) {
      alert('❌ Error: ' + err.message);
    }
  }

  // ==================== CARGAR TABLA PRINCIPAL ====================
  async function cargar(seccion, btn) {
    seccionActual = seccion;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    
    const titulos = { 
      'pacientes': 'Pacientes', 'doctores': 'Doctores', 'Enfermeras': 'Enfermeras', 
      'Medicamentos': 'Medicamentos', 'Citas': 'Citas', 'habitaciones': 'Habitaciones' 
    };
    document.getElementById('card-title').textContent = titulos[seccion] || seccion;
    document.getElementById('contenido').innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Cargando datos...</div>';

    try {
      const rutaAPI = seccion === 'Enfermeras' ? 'Enfermeros' : seccion;
      const res = await fetch('/api/' + rutaAPI);
      const datos = await res.json();

      if (datos.error) {
        document.getElementById('contenido').innerHTML = `<div class="error">Error: ${datos.error}</div>`;
        return;
      }

      document.getElementById('count-badge').textContent = datos.length + ' registro' + (datos.length !== 1 ? 's' : '');

      if (!datos.length) {
        document.getElementById('contenido').innerHTML = '<div class="empty">No hay registros.</div>';
        return;
      }

      const cols = Object.keys(datos[0]);
      let html = '<div style="overflow-x:auto"><table><thead><tr>';
      cols.forEach(c => html += `<th>${c}</th>`);
      html += '<th>Acciones</th></tr></thead><tbody>';
      
      datos.forEach(fila => {
        html += '<tr>';
        cols.forEach(c => html += `<td>${fila[c] ?? ''}</td>`);
        const id = fila['ID'] || fila['id'] || fila[cols[0]];
        
        html += '<td class="acciones">';
        if (esAdmin) {
          html += `<button class="btn-edit" onclick="editarRegistro('${seccion}', ${id})"><i class="fas fa-edit"></i> Editar</button>
                   <button class="btn-delete" onclick="eliminarRegistro('${seccion}', ${id})"><i class="fas fa-trash"></i> Eliminar</button>`;
        } else {
          html += '<span style="color:#64748b; font-size:12px;"><i class="fas fa-eye"></i> Solo lectura</span>';
        }
        html += '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      document.getElementById('contenido').innerHTML = html;
    } catch(err) {
      document.getElementById('contenido').innerHTML = `<div class="error">Error: ${err.message}</div>`;
    }
  }

  // ==================== ABRIR MODAL CON FORMULARIO ====================
  async function abrirModal() {
    if (!esAdmin) {
      alert('No tiene permisos para agregar registros.');
      return;
    }
    
    if (seccionActual === 'pacientes' && ciudadesDisponibles.length === 0) await cargarCiudades();
    if (seccionActual === 'doctores' && especialidadesDisponibles.length === 0) await cargarEspecialidades();
    if (seccionActual === 'Enfermeras' && especializacionesDisponibles.length === 0) await cargarEspecializaciones();
    if (seccionActual === 'Enfermeras' && departamentosDisponibles.length === 0) await cargarDepartamentos();
    if (seccionActual === 'Citas' && pacientesDisponibles.length === 0) await cargarPacientes();
    if (seccionActual === 'Citas' && doctoresDisponibles.length === 0) await cargarDoctores();
    if (seccionActual === 'habitaciones' && tiposHabitacionDisponibles.length === 0) await cargarTiposHabitacion();
    
    const configs = {
      'pacientes': {
        titulo: 'Nuevo Paciente',
        campos: [
          { label: 'Primer Nombre', id: 'nombre', type: 'text', required: true },
          { label: 'Apellido', id: 'apellido', type: 'text', required: true },
          { label: 'Fecha de Nacimiento', id: 'fecha_nacimiento', type: 'date', required: true },
          { label: 'Género', id: 'genero', type: 'select', opciones: ['M', 'F'] },
          { label: 'Ciudad', id: 'ciudad_id', type: 'ciudades' },
          { label: 'Teléfono', id: 'telefono', type: 'tel', placeholder: 'Ej: 9999-9999' },
          { label: 'Correo', id: 'correo', type: 'email', placeholder: 'ejemplo@correo.com' }
        ]
      },
      'doctores': {
        titulo: 'Nuevo Doctor',
        campos: [
          { label: 'Primer Nombre', id: 'nombre', type: 'text', required: true },
          { label: 'Apellido', id: 'apellido', type: 'text', required: true },
          { label: 'Especialidad', id: 'especialidad', type: 'especialidades', required: true },
          { label: 'Teléfono', id: 'telefono', type: 'tel' },
          { label: 'Correo', id: 'correo', type: 'email' },
          { label: 'Horario Disponible', id: 'horario', type: 'text' }
        ]
      },
      'Enfermeras': {
        titulo: 'Nueva Enfermera',
        campos: [
          { label: 'Nombre', id: 'nombre', type: 'text', required: true },
          { label: 'Apellido', id: 'apellido', type: 'text', required: true },
          { label: 'Especialización', id: 'especializacion', type: 'especializaciones' },
          { label: 'Departamento', id: 'departamento_id', type: 'departamentos' },
          { label: 'Horas de Turno', id: 'horas_turno', type: 'text' }
        ]
      },
      'Medicamentos': {
        titulo: 'Nuevo Medicamento',
        campos: [
          { label: 'Nombre', id: 'nombre', type: 'text', required: true },
          { label: 'Marca', id: 'marca', type: 'text' },
          { label: 'Tipo', id: 'tipo', type: 'text' },
          { label: 'Dosis', id: 'dosis', type: 'text' },
          { label: 'Stock', id: 'stock', type: 'number', required: true, min: 0 }
        ]
      },
      'Citas': {
        titulo: 'Nueva Cita',
        campos: [
          { label: 'Paciente', id: 'paciente_id', type: 'pacientes', required: true },
          { label: 'Doctor', id: 'doctor_id', type: 'doctores' },
          { label: 'Fecha', id: 'fecha_cita', type: 'date', required: true },
          { label: 'Hora', id: 'hora_cita', type: 'time', required: true },
          { label: 'Propósito', id: 'proposito', type: 'text' }
        ]
      },
      'habitaciones': {
        titulo: 'Nueva Habitación',
        campos: [
          { label: 'Número', id: 'numero', type: 'text', required: true },
          { label: 'Tipo', id: 'tipo_id', type: 'tipos-habitacion' },
          { label: 'Capacidad', id: 'capacidad', type: 'number', min: 1 },
          { label: 'Estado', id: 'estado', type: 'select', opciones: ['Disponible', 'Ocupada', 'Mantenimiento', 'Limpieza'] }
        ]
      }
    };

    const config = configs[seccionActual];
    if (!config) { alert('Formulario no disponible'); return; }

    if (!registroEditando) {
      document.getElementById('modal-titulo').innerHTML = `<i class="fas fa-plus-circle"></i> ${config.titulo}`;
    }
    
    let html = '<form id="formDinamico">';
    config.campos.forEach(campo => {
      html += `<div class="form-group"><label>${campo.label} ${campo.required ? '<span style="color:red">*</span>' : ''}</label>`;
      
      if (campo.type === 'ciudades') {
        html += `<select id="${campo.id}" ${campo.required ? 'required' : ''}><option value="">Seleccione una ciudad...</option>`;
        ciudadesDisponibles.forEach(c => html += `<option value="${c.id}">${c.nombre}</option>`);
        html += `</select>`;
      } else if (campo.type === 'especialidades') {
        html += `<select id="${campo.id}" ${campo.required ? 'required' : ''}><option value="">Seleccione una especialidad...</option>`;
        especialidadesDisponibles.forEach(e => html += `<option value="${e.nombre}">${e.nombre}</option>`);
        html += `<option value="__OTRA__">➕ Otra (escribir)</option></select>`;
        html += `<input type="text" id="${campo.id}_manual" placeholder="Especifique otra especialidad" style="display:none; margin-top:10px;">`;
      } else if (campo.type === 'especializaciones') {
        html += `<select id="${campo.id}" ${campo.required ? 'required' : ''}><option value="">Seleccione una especialización...</option>`;
        especializacionesDisponibles.forEach(e => html += `<option value="${e.nombre}">${e.nombre}</option>`);
        html += `<option value="__OTRA__">➕ Otra (escribir)</option></select>`;
        html += `<input type="text" id="${campo.id}_manual" placeholder="Especifique otra especialización" style="display:none; margin-top:10px;">`;
      } else if (campo.type === 'departamentos') {
        html += `<select id="${campo.id}" ${campo.required ? 'required' : ''}><option value="">Seleccione un departamento...</option>`;
        departamentosDisponibles.forEach(d => html += `<option value="${d.id}">${d.nombre}</option>`);
        html += `</select>`;
      } else if (campo.type === 'pacientes') {
        html += `<select id="${campo.id}" ${campo.required ? 'required' : ''}><option value="">Seleccione un paciente...</option>`;
        pacientesDisponibles.forEach(p => html += `<option value="${p.id}">${p.nombre}</option>`);
        html += `</select>`;
      } else if (campo.type === 'doctores') {
        html += `<select id="${campo.id}" ${campo.required ? 'required' : ''}><option value="">Seleccione un doctor...</option>`;
        doctoresDisponibles.forEach(d => html += `<option value="${d.id}">${d.nombre}</option>`);
        html += `</select>`;
      } else if (campo.type === 'tipos-habitacion') {
        html += `<select id="${campo.id}" ${campo.required ? 'required' : ''}><option value="">Seleccione un tipo...</option>`;
        tiposHabitacionDisponibles.forEach(t => html += `<option value="${t.id}">${t.nombre}</option>`);
        html += `</select>`;
      } else if (campo.type === 'select') {
        html += `<select id="${campo.id}" ${campo.required ? 'required' : ''}><option value="">Seleccione...</option>`;
        campo.opciones.forEach(o => html += `<option value="${o}">${o}</option>`);
        html += `</select>`;
      } else {
        html += `<input type="${campo.type}" id="${campo.id}" ${campo.required ? 'required' : ''} ${campo.min ? `min="${campo.min}"` : ''} placeholder="${campo.placeholder || 'Ingrese ' + campo.label.toLowerCase()}">`;
      }
      html += `</div>`;
    });
    html += '</form>';
    document.getElementById('modal-body').innerHTML = html;
    
    const selectEsp = document.getElementById('especialidad');
    if (selectEsp) selectEsp.addEventListener('change', function() {
      document.getElementById('especialidad_manual').style.display = this.value === '__OTRA__' ? 'block' : 'none';
    });
    const selectEspz = document.getElementById('especializacion');
    if (selectEspz) selectEspz.addEventListener('change', function() {
      document.getElementById('especializacion_manual').style.display = this.value === '__OTRA__' ? 'block' : 'none';
    });
    
    document.getElementById('modalFormulario').classList.add('active');
  }

  function cerrarModal() { 
    document.getElementById('modalFormulario').classList.remove('active');
    if (registroEditando) {
      document.getElementById('btnGuardar').innerHTML = '<i class="fas fa-save"></i> Guardar';
      document.getElementById('btnGuardar').onclick = guardarRegistro;
      registroEditando = null;
    }
  }

  // ==================== GUARDAR REGISTRO (SOLO ADMIN) ====================
  async function guardarRegistro() {
    if (!esAdmin) {
      alert('No tiene permisos para agregar registros.');
      return;
    }
    
    const form = document.getElementById('formDinamico');
    const campos = form.querySelectorAll('input, select');
    for (let c of campos) if (c.required && !c.value.trim()) { alert('Complete campos obligatorios'); return; }
    
    const data = {};
    campos.forEach(c => {
      if (c.value.trim()) {
        if (c.id === 'especialidad' && c.value === '__OTRA__') data[c.id] = document.getElementById('especialidad_manual').value;
        else if (c.id === 'especializacion' && c.value === '__OTRA__') data[c.id] = document.getElementById('especializacion_manual').value;
        else data[c.id] = c.value;
      }
    });

    if (seccionActual === 'Citas') data.estado_id = 1;

    try {
      const rutaAPI = seccionActual === 'Enfermeras' ? 'Enfermeras' : seccionActual;
      const res = await fetch('/api/' + rutaAPI, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      const result = await res.json();
      if (result.success) { 
        alert('✅ Agregado correctamente'); 
        cerrarModal(); 
        cargar(seccionActual, document.querySelector('.nav-btn.active')); 
        cargarStat(seccionActual); 
      } else { 
        alert('❌ ' + (result.error || 'Error al guardar')); 
      }
    } catch(e) { 
      alert('❌ Error de conexión: ' + e.message); 
    }
  }

  document.getElementById('modalFormulario').addEventListener('click', function(e) { if (e.target === this) cerrarModal(); });

  // ==================== INICIALIZAR ====================
  async function inicializar() {
    await Promise.all([
      cargarCiudades(), cargarEspecialidades(), cargarEspecializaciones(), 
      cargarDepartamentos(), cargarPacientes(), cargarDoctores(), cargarTiposHabitacion()
    ]);
    ['pacientes', 'doctores', 'Enfermeras', 'Medicamentos', 'Citas', 'habitaciones'].forEach(cargarStat);
    cargar('pacientes', document.querySelector('.nav-btn'));
  }
  inicializar();
</script>
</body>
</html>
